<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ImageMatch</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Draggable toolbar area used to move the borderless window -->
    <header class="toolbar">
      <div class="drag-region">ImageMatch</div>
      <div class="controls no-drag">
        <button id="openButton" class="btn">Open Image</button>
        <div class="window-controls">
          <button id="minimizeButton" class="btn ghost" title="Minimize">–</button>
          <button id="closeButton" class="btn ghost" title="Close">×</button>
        </div>
      </div>
    </header>

    <div class="image-strip no-drag">
      <button id="prevImage" class="btn ghost icon" title="Previous">◀</button>
      <div class="image-info">
        <div class="thumb">
          <img id="thumbImage" alt="Preview" />
        </div>
        <div class="meta">
          <div id="imageName" class="image-name">No image loaded</div>
          <div id="imageCount" class="image-count">0 / 0</div>
        </div>
      </div>
      <button id="nextImage" class="btn ghost icon" title="Next">▶</button>
    </div>

    <footer class="bottom-bar no-drag">
      <label class="toggle">
        <input id="alwaysOnTopToggle" type="checkbox" checked />
        <span>Always on top</span>
      </label>
      <label class="slider">
        <span>Opacity</span>
        <input id="opacitySlider" type="range" min="0.2" max="1" step="0.05" />
      </label>
      <button id="resetZoom" class="btn ghost">Reset Zoom</button>
    </footer>

    <!-- Main content area drag and drop images and displays them -->
    <main id="dropZone" class="drop-zone">
      <div id="placeholder" class="placeholder">
        <p>Drop an image here or click <strong>Open Image</strong>.</p>
      </div>
      <div class="image-wrapper">
        <img id="image" alt="Reference" />
      </div>
    </main>

    <!-- handles buttons, drag/drop, zoom, and state -->
    <script src="renderer.js"></script>
  </body>
</html>
